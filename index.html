<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IUBello Talento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --navy-950:#0F1D33;
  --navy-900:#142B4F;
  --navy-800:#1F3E6E;
  --navy-700:#2A4E85;
  --navy-100:#E7ECF4;
  --navy-050:#F3F6FA;
  --gold-700:#8F6323;
  --gold-600:#A9762C;
  --gold-500:#B8863C;
  --gold-100:#F3E7D2;
  --bg:#F5F6F8;
  --surface:#FFFFFF;
  --text:#181C24;
  --text-muted:#5B6472;
  --text-faint:#8A93A3;
  --border:#E1E5EB;
  --border-strong:#C9D0DB;
  --success:#276A4F;
  --success-bg:#E3F1EA;
  --warning:#8A5B10;
  --warning-bg:#FBF0DC;
  --danger:#A03A3A;
  --danger-bg:#F8E9E9;
  --info:#2A5C99;
  --info-bg:#E7EEF7;
  --neutral-bg:#EDEFF3;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;
  --shadow-card:0 1px 2px rgba(15,29,51,0.06), 0 1px 1px rgba(15,29,51,0.04);
  --shadow-pop:0 12px 32px rgba(15,29,51,0.18);
  --font-display:'Source Serif 4', Georgia, serif;
  --font-body:'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; color:var(--navy-950); font-weight:600;}
p{margin:0;}
button{font-family:var(--font-body); cursor:pointer;}
a{color:inherit;}
::selection{background:var(--gold-100);}

/* focus visibility */
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:2px solid var(--navy-700);
  outline-offset:2px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

.scroll-fade{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

/* ============ APP ROOT ============ */
#app{min-height:100vh;}
.hidden{display:none !important;}

/* ============ PROTOTYPE BADGE ============ */
.proto-tag{
  font-size:11px;
  color:var(--text-faint);
  letter-spacing:.01em;
  border:1px solid var(--border);
  padding:3px 9px;
  border-radius:999px;
  background:var(--surface);
  white-space:nowrap;
}

/* ============ LOGIN SCREEN ============ */
.login-wrap{
  min-height:100vh;
  display:grid;
  grid-template-columns:1.15fr 1fr;
}
@media (max-width:860px){ .login-wrap{grid-template-columns:1fr;} .login-visual{display:none;} }

.login-visual{
  background:linear-gradient(165deg, var(--navy-950) 0%, var(--navy-900) 55%, var(--navy-800) 100%);
  color:#fff;
  padding:64px 56px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  position:relative;
  overflow:hidden;
}
.login-visual::after{
  content:"";
  position:absolute;
  right:-120px; top:-120px;
  width:420px; height:420px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.08);
}
.login-visual::before{
  content:"";
  position:absolute;
  right:-60px; bottom:-160px;
  width:320px; height:320px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.08);
}
.login-brand{display:flex; align-items:center; gap:12px; position:relative; z-index:1;}
.login-mark{
  width:44px; height:44px; border-radius:10px;
  background:var(--gold-500);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; color:var(--navy-950); font-size:19px;
}
.login-brand-name{font-family:var(--font-display); font-size:20px; font-weight:600; letter-spacing:.01em;}
.login-brand-sub{font-size:12px; color:rgba(255,255,255,0.6); margin-top:1px;}

.login-hero{position:relative; z-index:1; max-width:460px;}
.login-hero h1{color:#fff; font-size:38px; line-height:1.18; font-weight:600;}
.login-hero .accent{color:var(--gold-500);}
.login-hero p{color:rgba(255,255,255,0.72); margin-top:18px; font-size:15px; line-height:1.6;}

.login-flow{display:flex; gap:0; margin-top:36px; position:relative; z-index:1;}
.login-flow-step{flex:1; padding-right:14px; position:relative;}
.login-flow-step:not(:last-child)::after{
  content:"→"; position:absolute; right:-2px; top:0; color:rgba(255,255,255,0.35); font-size:14px;
}
.login-flow-step .n{font-family:var(--font-display); font-size:13px; color:var(--gold-500); font-weight:600;}
.login-flow-step .t{font-size:12.5px; color:rgba(255,255,255,0.75); margin-top:4px; line-height:1.4;}

.login-foot{position:relative; z-index:1; font-size:12px; color:rgba(255,255,255,0.45);}

.login-panel{
  display:flex; align-items:center; justify-content:center;
  padding:40px 32px;
}
.login-card{width:100%; max-width:380px;}
.login-card-head{margin-bottom:28px;}
.login-card-head h2{font-size:23px;}
.login-card-head p{color:var(--text-muted); font-size:13.5px; margin-top:6px;}

.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--text); margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);
  font-size:14px;
  font-family:var(--font-body);
  background:var(--surface);
  color:var(--text);
}
.field textarea{resize:vertical; min-height:80px;}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--navy-700);}
.field-hint{font-size:11.5px; color:var(--text-faint); margin-top:5px;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:var(--radius-sm);
  border:1px solid transparent;
  padding:10px 18px;
  font-size:13.5px;
  font-weight:600;
  transition:background .12s ease, border-color .12s ease, color .12s ease;
}
.btn-primary{background:var(--navy-900); color:#fff;}
.btn-primary:hover{background:var(--navy-800);}
.btn-primary:disabled{background:var(--neutral-bg); color:var(--text-faint); cursor:default;}
.btn-gold{background:var(--gold-600); color:#fff;}
.btn-gold:hover{background:var(--gold-700);}
.btn-outline{background:var(--surface); color:var(--navy-900); border-color:var(--border-strong);}
.btn-outline:hover{border-color:var(--navy-700); background:var(--navy-050);}
.btn-ghost{background:transparent; color:var(--text-muted); border-color:transparent;}
.btn-ghost:hover{background:var(--neutral-bg); color:var(--text);}
.btn-sm{padding:6px 12px; font-size:12.5px;}
.btn-block{width:100%;}
.btn-danger-outline{background:var(--surface); color:var(--danger); border-color:var(--danger-bg);}
.btn-danger-outline:hover{background:var(--danger-bg);}

.login-divider{display:flex; align-items:center; gap:10px; margin:22px 0; color:var(--text-faint); font-size:12px;}
.login-divider::before,.login-divider::after{content:""; flex:1; height:1px; background:var(--border);}

.demo-roles{display:flex; flex-direction:column; gap:8px;}
.demo-role-btn{
  display:flex; align-items:center; gap:12px;
  padding:11px 13px;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  background:var(--surface);
  text-align:left;
  width:100%;
}
.demo-role-btn:hover{border-color:var(--navy-700); background:var(--navy-050);}
.demo-role-icon{
  width:32px; height:32px; border-radius:8px; flex:none;
  display:flex; align-items:center; justify-content:center;
  background:var(--navy-100); color:var(--navy-900); font-weight:700; font-size:13px; font-family:var(--font-display);
}
.demo-role-text b{display:block; font-size:13px; color:var(--text);}
.demo-role-text span{display:block; font-size:11.5px; color:var(--text-faint); margin-top:1px;}

.login-error{
  background:var(--danger-bg); color:var(--danger); border-radius:var(--radius-sm);
  padding:9px 12px; font-size:12.5px; margin-bottom:14px;
}

/* ============ APP SHELL ============ */
.shell{display:grid; grid-template-columns:236px 1fr; min-height:100vh;}
@media (max-width:900px){ .shell{grid-template-columns:76px 1fr;} }

.sidebar{
  background:var(--navy-950);
  color:#fff;
  padding:22px 16px;
  display:flex;
  flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.sb-brand{display:flex; align-items:center; gap:10px; padding:0 6px 22px; border-bottom:1px solid rgba(255,255,255,0.1); margin-bottom:18px;}
.sb-mark{width:34px; height:34px; border-radius:8px; background:var(--gold-500); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; color:var(--navy-950); font-size:15px; flex:none;}
.sb-brand-text{line-height:1.25;}
.sb-brand-text b{font-family:var(--font-display); font-size:14.5px; display:block;}
.sb-brand-text span{font-size:10.5px; color:rgba(255,255,255,0.5);}
@media (max-width:900px){ .sb-brand-text, .nav-label, .sb-role-tag span{display:none;} }

.sb-role-tag{font-size:10.5px; text-transform:none; letter-spacing:.02em; color:var(--gold-500); padding:0 6px; margin-bottom:14px; font-weight:600;}

.nav-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; flex:1;}
.nav-item button{
  width:100%; display:flex; align-items:center; gap:12px;
  background:transparent; border:none; color:rgba(255,255,255,0.68);
  padding:10px 12px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:500;
  text-align:left;
}
.nav-item button:hover{background:rgba(255,255,255,0.06); color:#fff;}
.nav-item.active button{background:rgba(255,255,255,0.1); color:#fff;}
.nav-item.active button .nav-dot{background:var(--gold-500);}
.nav-icon{width:18px; height:18px; flex:none; display:flex; align-items:center; justify-content:center;}
.nav-icon svg{width:17px; height:17px;}

.sb-foot{border-top:1px solid rgba(255,255,255,0.1); padding-top:14px; margin-top:10px;}
.sb-user{display:flex; align-items:center; gap:10px; padding:0 6px; margin-bottom:10px;}
.sb-avatar{width:32px; height:32px; border-radius:50%; background:var(--navy-700); display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; flex:none;}
.sb-user-text{line-height:1.25; overflow:hidden;}
.sb-user-text b{font-size:12.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.sb-user-text span{font-size:10.5px; color:rgba(255,255,255,0.5);}
.sb-logout{width:100%; background:transparent; border:1px solid rgba(255,255,255,0.15); color:rgba(255,255,255,0.75); padding:8px 12px; border-radius:var(--radius-sm); font-size:12.5px; display:flex; align-items:center; gap:8px; justify-content:center;}
.sb-logout:hover{background:rgba(255,255,255,0.08); color:#fff;}

/* ============ MAIN AREA ============ */
.main{display:flex; flex-direction:column; min-width:0;}
.topbar{
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:16px 32px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:5;
}
.topbar h1{font-size:20px;}
.topbar-sub{font-size:12.5px; color:var(--text-muted); margin-top:3px;}
.content{padding:28px 32px 60px; flex:1;}
@media (max-width:640px){ .topbar{padding:14px 18px;} .content{padding:20px 16px 48px;} }

/* ============ CARDS / GRIDS ============ */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow-card);}
.card-pad{padding:20px 22px;}
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:980px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }
@media (max-width:640px){ .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;} }

.section{margin-bottom:30px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; gap:12px; flex-wrap:wrap;}
.section-head h2{font-size:17px;}
.section-head .desc{font-size:12.5px; color:var(--text-muted); margin-top:3px;}

.kpi-card{padding:18px 20px;}
.kpi-num{font-family:var(--font-display); font-size:32px; color:var(--navy-950); font-weight:700; line-height:1;}
.kpi-label{font-size:12.5px; color:var(--text-muted); margin-top:8px;}
.kpi-icon{width:34px; height:34px; border-radius:9px; background:var(--navy-100); color:var(--navy-800); display:flex; align-items:center; justify-content:center; margin-bottom:12px;}
.kpi-icon svg{width:17px; height:17px;}

/* ============ BADGES ============ */
.badge{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:600; white-space:nowrap;}
.badge-dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
.badge-info{background:var(--info-bg); color:var(--info);}
.badge-success{background:var(--success-bg); color:var(--success);}
.badge-warning{background:var(--warning-bg); color:var(--warning);}
.badge-danger{background:var(--danger-bg); color:var(--danger);}
.badge-neutral{background:var(--neutral-bg); color:var(--text-muted);}
.badge-gold{background:var(--gold-100); color:var(--gold-700);}

/* ============ TABLE ============ */
.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11.5px; text-transform:none; color:var(--text-faint); font-weight:600; padding:0 14px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:13px 14px; border-bottom:1px solid var(--border); color:var(--text); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--navy-050);}
.cell-strong{font-weight:600; color:var(--navy-950);}
.cell-muted{color:var(--text-muted); font-size:12.5px;}

/* ============ VACANCY CARD ============ */
.vac-card{padding:18px 20px; display:flex; flex-direction:column; gap:10px; cursor:pointer; transition:border-color .12s ease, box-shadow .12s ease;}
.vac-card:hover{border-color:var(--navy-700); box-shadow:0 4px 14px rgba(15,29,51,0.08);}
.vac-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.vac-title{font-family:var(--font-display); font-size:16.5px; color:var(--navy-950); font-weight:600;}
.vac-company{font-size:12.5px; color:var(--text-muted); margin-top:2px;}
.vac-meta{display:flex; flex-wrap:wrap; gap:7px;}
.vac-tag{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; padding:4px 9px; border-radius:6px; background:var(--navy-050); color:var(--navy-800); border:1px solid var(--navy-100);}
.tag-icon{width:12px; height:12px; flex:none;}
.vac-foot{display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--text-faint); padding-top:8px; border-top:1px solid var(--border);}

/* ============ FILTER BAR ============ */
.filter-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
.filter-bar input[type=text]{flex:1; min-width:180px;}
.filter-bar select, .filter-bar input{padding:9px 12px; border:1px solid var(--border-strong); border-radius:var(--radius-sm); font-size:13px; background:var(--surface); font-family:var(--font-body);}

/* ============ PROGRESS BAR ============ */
.progress-track{width:100%; height:9px; border-radius:999px; background:var(--neutral-bg); overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg, var(--gold-600), var(--gold-500)); border-radius:999px;}
.progress-label{display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted); margin-bottom:7px;}

/* ============ KPI HIERARCHY ============ */
.kpi-primary{padding:22px 24px;}
.kpi-primary .kpi-num{font-size:38px;}
.kpi-primary .kpi-icon{width:38px; height:38px; background:var(--navy-950); color:var(--gold-500);}
.kpi-secondary{padding:15px 18px;}
.kpi-secondary .kpi-num{font-size:23px;}
.kpi-secondary .kpi-label{margin-top:5px; font-size:11.5px;}
.kpi-secondary .kpi-icon{width:28px; height:28px; margin-bottom:8px;}

/* ============ TIMELINE (Mi práctica) ============ */
.timeline{display:flex; justify-content:space-between; position:relative; padding:8px 4px 0;}
.timeline::before{content:""; position:absolute; top:17px; left:24px; right:24px; height:1px; background:var(--border);}
.timeline-item{flex:1; position:relative; text-align:center; padding:0 6px;}
.timeline-dot{width:34px; height:34px; border-radius:50%; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; position:relative; z-index:1; background:var(--surface); border:2px solid var(--border-strong); color:var(--text-faint);}
.timeline-item.done .timeline-dot{background:var(--success); border-color:var(--success); color:#fff;}
.timeline-item.current .timeline-dot{background:var(--gold-600); border-color:var(--gold-600); color:#fff; box-shadow:0 0 0 4px var(--gold-100);}
.timeline-item.pending .timeline-dot{background:var(--surface); border-color:var(--border-strong); color:var(--text-faint);}
.timeline-dot svg{width:15px; height:15px;}
.timeline-name{font-size:12.5px; font-weight:600; color:var(--text);}
.timeline-state{font-size:11px; color:var(--text-muted); margin-top:2px;}
.timeline-item.current .timeline-state{color:var(--gold-700); font-weight:600;}
.timeline-date{font-size:10.5px; color:var(--text-faint); margin-top:3px; line-height:1.4;}
@media (max-width:760px){
  .timeline{flex-direction:column; gap:20px; align-items:flex-start;}
  .timeline::before{display:none;}
  .timeline-item{display:flex; align-items:flex-start; gap:12px; text-align:left; padding:0; width:100%;}
  .timeline-dot{margin:0;}
  .timeline-item:not(:last-child)::after{content:""; position:absolute; left:16px; top:34px; width:1px; height:calc(100% + 4px); background:var(--border);}
}

/* ============ HOURS STAT CARDS ============ */
.hours-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px;}
.hours-stat{border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 16px; text-align:center; background:var(--navy-050);}
.hours-stat .n{font-family:var(--font-display); font-size:24px; font-weight:700; color:var(--navy-950);}
.hours-stat .l{font-size:11px; color:var(--text-muted); margin-top:4px;}
.hours-pct-tag{display:inline-block; background:var(--gold-100); color:var(--gold-700); font-size:12px; font-weight:600; padding:4px 11px; border-radius:999px; margin-top:8px;}

/* ============ VERTICAL BAR CHART (evolución) ============ */
.vbar-chart{display:flex; align-items:flex-end; gap:14px; height:140px; padding-top:10px;}
.vbar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
.vbar-value{font-size:11px; color:var(--text-muted); margin-bottom:6px;}
.vbar-track{width:100%; max-width:34px; background:var(--navy-800); border-radius:5px 5px 2px 2px;}
.vbar-label{font-size:11px; color:var(--text-faint); margin-top:8px;}

/* ============ BAR CHART (CSS) ============ */
.bar-chart{display:flex; flex-direction:column; gap:12px;}
.bar-row{display:grid; grid-template-columns:170px 1fr 40px; align-items:center; gap:12px;}
.bar-row .bar-label{font-size:12.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bar-track{height:10px; border-radius:999px; background:var(--neutral-bg); overflow:hidden;}
.bar-fill{height:100%; border-radius:999px; background:var(--navy-800);}
.bar-value{font-size:12px; color:var(--text-muted); text-align:right;}
@media (max-width:640px){ .bar-row{grid-template-columns:110px 1fr 32px;} }

/* ============ MODAL ============ */
.modal-overlay{
  position:fixed; inset:0; background:rgba(15,20,30,0.55);
  display:flex; align-items:flex-start; justify-content:center;
  padding:40px 20px; overflow-y:auto; z-index:50;
}
.modal-box{background:var(--surface); border-radius:var(--radius-lg); max-width:640px; width:100%; box-shadow:var(--shadow-pop); animation:fadeIn .18s ease;}
.modal-head{display:flex; justify-content:space-between; align-items:flex-start; padding:22px 26px; border-bottom:1px solid var(--border);}
.modal-body{padding:22px 26px;}

/* ---------- HELPERS ---------- */
function findEmpresa(id){ return EMPRESAS.find(e=>e.id===id); }
function findVacante(id){ return VACANTES.find(v=>v.id===id); }
function findEstudiante(id){ return ESTUDIANTES.find(s=>s.id===id); }
function fmtDate(iso){
  const d = new Date(iso+"T00:00:00");
  const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return d.getDate()+" "+meses[d.getMonth()]+". "+d.getFullYear();
}
function initials(name){ return name.split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  return APLICACIONES.filter(a=>a.estudianteId==="s1").sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));

function yaPostulado(vacId){
  return APLICACIONES.some(a=>a.vacanteId===vacId && a.estudianteId==="s1");
}

let toastTimer = null;
function showToast(msg){
  const el = document.getElementById("toast-host");
  if(!el) return;
  el.innerHTML = '<div class="toast"><span class="dot"></span>'+msg+'</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.innerHTML = ""; }, 3200);
}

function handleManualLogin(ev){
  ev.preventDefault();
  const email = document.getElementById("login-email").value.trim().toLowerCase();
  const user = DEMO_USERS[email];
  if(user){
    loginError = "";
    state.currentUser = { role:user.role, name:user.name, email };
    state.view = NAV_ITEMS[user.role][0].id;
    state.screen = "app";
    render();
  } else {
    loginError = "No encontramos una cuenta con ese correo. Usa uno de los usuarios de demostración.";
    render();
  }
  return false;
}

function loginAsRole(role){
  const entry = Object.entries(DEMO_USERS).find(([,u])=>u.role===role);
  loginError = "";
  state.currentUser = { role, name:entry[1].name, email:entry[0] };
  state.view = NAV_ITEMS[role][0].id;
  state.screen = "app";
  render();
}

function logout(){
  state.currentUser = null;
  state.view = null;
  state.modal = null;
  state.screen = "landing";
  render();
}

function switchDemoRole(role){
  const entry = Object.entries(DEMO_USERS).find(([,u])=>u.role===role);
  state.currentUser = { role, name:entry[1].name, email:entry[0] };
  state.view = NAV_ITEMS[role][0].id;
  state.modal = null;
  state.sidebarOpen = false;
  render();
  showToast("Modo demostración — ahora estás viendo el portal de "+ROLE_LABELS[role].toLowerCase());
}

    id:"v"+(VACANTES.length+1)+"_"+Date.now().toString().slice(-4),

    ciudad: document.getElementById("pv-ciudad").value,

    descripcion: document.getElementById("pv-desc").value.trim(),
    responsabilidades: ["Apoyar las actividades asignadas por el equipo","Participar en el seguimiento de tareas del área"],
    requisitos: reqsRaw ? reqsRaw.split("\n").map(s=>s.trim()).filter(Boolean) : ["Ser estudiante activo de IUBello"],

    fechaPublicacion: new Date().toISOString().slice(0,10),
    fechaLimite: document.getElementById("pv-fecha").value || new Date().toISOString().slice(0,10),
  };
  VACANTES.push(newVac);
  closeModal();
  showToast("Vacante publicada correctamente");
  return false;
}

function barChart(data, max){
  const m = max || Math.max(...data.map(d=>d.valor));
  return `<div class="bar-chart">${data.map(d=>`
    <div class="bar-row">
      <div class="bar-label">${d.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round((d.valor/m)*100)}%; ${d.color?`background:${d.color};`:""}"></div></div>
      <div class="bar-value">${d.valor}</div>
    </div>`).join("")}</div>`;
}
function verticalBarChart(data, max){
  const m = max || Math.max(...data.map(d=>d.valor));
  return `<div class="vbar-chart">${data.map(d=>`
    <div class="vbar-col">
      <div class="vbar-value">${d.valor}</div>
      <div class="vbar-track" style="height:${Math.max(6,Math.round((d.valor/m)*100))}%"></div>
      <div class="vbar-label">${d.label}</div>
    </div>`).join("")}</div>`;
}

/* ---------- RENDER PRINCIPAL ---------- */
/*
 * captureFocus / restoreFocus
 * ----------------------------
 * render() reconstruye todo el HTML de #app en cada cambio de estado,
 * lo que reemplaza los nodos del DOM existentes. Sin este mecanismo,
 * un campo de texto con oninput (por ejemplo, los buscadores de
 * "Oportunidades" y "Estudiantes") pierde el foco después de cada
 * caracter, porque el input viejo se destruye y se crea uno nuevo.
 *
 * La solución: antes de re-renderizar, se guarda cuál elemento tenía
 * el foco (identificado por el atributo data-focus-key, no por
 * posición en el DOM) y la posición del cursor. Después de
 * re-renderizar, se busca el elemento con esa misma clave y se le
 * devuelve el foco y la posición del cursor.
 *
 * Solo afecta a los elementos que tengan data-focus-key; el resto del
 * comportamiento de render() no cambia.
 */
function captureFocus(root){
  const el = document.activeElement;
  if(!el || !root.contains(el)) return null;
  const key = el.getAttribute("data-focus-key");
  if(!key) return null;
  const info = { key };
  if(typeof el.selectionStart === "number" && typeof el.selectionEnd === "number"){
    info.selectionStart = el.selectionStart;
    info.selectionEnd = el.selectionEnd;
  }
  return info;
}

function restoreFocus(root, info){
  if(!info) return;
  const el = root.querySelector('[data-focus-key="'+info.key+'"]');
  if(!el) return;
  el.focus();
  if(typeof info.selectionStart === "number" && typeof el.setSelectionRange === "function"){
    try{ el.setSelectionRange(info.selectionStart, info.selectionEnd); }catch(e){}
  }
}

function render(){
  const root = document.getElementById("app");
  const focusInfo = captureFocus(root);
  if(state.currentUser && state.screen==="app"){
    root.innerHTML = renderShell();
  } else if(state.screen==="login"){
    root.innerHTML = renderLogin();
  } else {
    root.innerHTML = renderLanding();
  }
  restoreFocus(root, focusInfo);
}
render();
